[project]
name = "gold-lgbm-mt5"
version = "0.2.0"
description = "LightGBM gold (XAUUSD) trading model with Optuna tuning, MT5 data feed and HTTP MCP server (news/macro tools delegated to external jin10/Alpha Vantage MCPs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "mcp>=1.2.0",
    "joblib>=1.4.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "pyarrow>=25.0.1",
]

[project.scripts]
gold-train = "gold_model.train:main"
gold-mcp = "gold_model.serve_mcp:main"
gold-backtest = "gold_model.backtest:main"
gold-accuracy = "gold_model.accuracy_check:main"
gold-drift = "gold_model.drift:main"
gold-trades = "gold_model.trade_history:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_model"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# MT5 terminal interactions intentionally degrade gracefully on any failure.
"src/gold_model/mt5_client.py" = ["BLE001", "S110"]
# Web scraping modules (cftc/gld): every fetch degrades gracefully to
# cache/None on any network failure by design.
"src/gold_model/cftc.py" = ["BLE001"]
"src/gold_model/gld_holdings.py" = ["BLE001"]
# Trade history: MT5 calls degrade gracefully with clear error dict.
# DTZ005: naive datetimes are intentional — the MT5 API interprets them in
# the terminal-server timezone; passing tz-aware values breaks the query window.
"src/gold_model/trade_history.py" = ["BLE001", "DTZ005"]
# Macro fetch: degrade to zero-filled features when network fails (documented).
"src/gold_model/macro_features.py" = ["BLE001"]
# Ledger writes must never break predictions.
"src/gold_model/ledger.py" = ["BLE001"]
# MCP server: tool calls must degrade gracefully; ledger writes never break predictions.
"src/gold_model/serve_mcp.py" = ["BLE001"]
# Training pipeline tolerates optional components (calibration/drift) failing.
"src/gold_model/train.py" = ["BLE001"]