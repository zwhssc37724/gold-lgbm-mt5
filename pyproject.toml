[project]
name = "gold-lgbm-mt5"
version = "0.1.0"
description = "LightGBM gold (XAUUSD) trading model with Optuna tuning, MT5 data feed and HTTP MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "mcp>=1.2.0",
    "joblib>=1.4.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "pyarrow>=25.0.1",
]

[project.scripts]
gold-train = "gold_model.train:main"
gold-mcp = "gold_model.serve_mcp:main"
gold-backtest = "gold_model.backtest:main"
gold-accuracy = "gold_model.accuracy_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_model"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# MT5 terminal interactions intentionally degrade gracefully on any failure.
"src/gold_model/mt5_client.py" = ["BLE001", "S110"]
